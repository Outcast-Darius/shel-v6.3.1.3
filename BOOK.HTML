<style>

}

}
image{

}

    text-decoration: none;

sub{

}

 }

color: black;

</style>

<script>
       function setTheme(theme){
    
    document.body.className="";
    document.body.classList.add(theme);
    localStorage.setItem("theme",theme);
    
}


  window.addEventListener("load",()=>{
    const localTheme=localStorage.getItem("theme") || "light";
    setTheme(localTheme);
    
    document.getElementById(localTheme).checked=true;
    
    
});
</script>

</head>
<body>
    <header>
        <nav>
    <a href="index.html">Home</a>
    <a href="BOOK.HTML">Book</a>
    <a href="RENT.HTML">Pay</a>
    <a href="HOUSE.HTML">House</a>
    
    
    </nav>
   
   <button id="sign"><a href="LOGIN.HTML">Sign In </a></button>
   <div class="profile" id="profile">
    <a href="PROFILE.HTML"><img src="" alt="profile photo" id="profileImg" ></a>
   </div>
   
   
   </header>
   
   <div class="modal" id="mpesa-modal">
    <div class="modal-window" >
        <h2>mpesa Payment</h2>
        <p>Enter Phone number to prompt payment.</p>
        
        <input id="telephone" type="tel" placeholder="+254712345678" minlength="10" maxlength="14">
        <br>
        <button id="prompt">Prompt</button>
    
    </div>
    </div>
    <div class="modal" id="pin-modal">
    <div class="modal-window" >
        <h2>mpesa Payment</h2>
        <p>ENTER MPESA PIN</p>
        <input type="password" name="pin" id="pin" placeholder="****" maxlength="4" minlength="4">
    <br>
        <button id="pay">Pay</button>
    
    </div>
    </div>
    <div class="modal" id="card-modal">
    <div class="modal-window" >
        <h2>BANK Payment</h2>
        <p>Enter Card Number</p>
        <input type="text" maxlength="20" placeholder="e.g 1234 4567 8901 2345 6789" minlength="16" id="cardNumber">
    <br>
        <button id="carding">Next</button>
   </div>
    </div>
   <div class="modal" id="cvv-modal">
    <div class="modal-window" >
        <h2>BANK Payment</h2>
        <p>Enter Card CVV</p>
    <input type="password" name="cvv" id="cvv" placeholder="*****" minlength="3" maxlength="4">
    <br>
        <button id="confirm">Pay</button>
    
    </div>
    </div>
   
   
   
    <form action="">
        <h2>BOOK ROOM</h2>
        <fieldset>
            <fieldset>
                <legend>NAME <SUP>*</SUP></legend>
                <input type="text" name="name" id="name" placeholder="Enter your full name" >
    
            </fieldset>
            <fieldset>
            <legend>ID / PASSPORT <SUP>*</SUP></legend>
            <input type="text" name="passport" id="passport" placeholder="Passport / ID number " >
            
            </fieldset>
            <fieldset>
                <legend>PHONE NUMBER <sup>*</sup></legend>
                <input type="tel" aria-readonly="true" name="phone" id="phone" placeholder="Phone number" >
                
                </fieldset>
                <fieldset>
                <legend>HOUSE NUMBER <sup>*</sup></legend>
                <input type="text" readonly  name="room" id="room" placeholder="House number" >
                
                
                </fieldset>
    
                <fieldset>
                <legend id="pay">DEPOSIT AMOUNT <SUP>*</SUP> <sub>ksh</sub></legend>
                <input type="text" readonly  name="amount" id="amount" placeholder="Amount in KSH" >
                
                </fieldset>
                <fieldset>
                <label for="mode">PAYMENT MODE :</label><select name="mode" id="mode">
                <option value=""></option>
                <option value="mpesa">M-PESA</option>
                <option value="card">CARD</option>
                <option value=""></option>
                
                </select>
                
                </fieldset>
                
        </fieldset>
        <button  id="post" onclick="hideRoom()">BOOK NOW</button>
    
    
    
    </form>  
    
   
    
    
    
    <script>
  
function generateCodes(length = 6) {
    const characters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
    let code = "";
    for (let i = 0; i < length; i++) {
        code += characters.charAt(Math.floor(Math.random() * characters.length));
    }
    return code;
}


function saveCode() {
    const code = generateCodes();
    
    localStorage.setItem("transactionCode", JSON.stringify(code));
}


function saveTransactionRecord(newRecord) {
    const existing = JSON.parse(localStorage.getItem("transactions")) || [];
    existing.push(newRecord);
    localStorage.setItem("transactions", JSON.stringify(existing));
}


function updateHistory(amount, mode, TID, room) {
    let historyArray = JSON.parse(localStorage.getItem("history")) || [];

    const newTransaction = {
        TID: TID,
        amount: amount,
        
        DATE: new Date().toISOString(), 
        mode: mode,
        room: room
    };

    historyArray.push(newTransaction);
    localStorage.setItem("history", JSON.stringify(historyArray));
}



saveCode();

const months = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
const d = new Date();
let currentMonth = months[d.getMonth()];
const date = d.getDate();
const today = new Date(); 


const roomNoInput = document.getElementById("room");
const depositInput = document.getElementById("amount");

const storedRoom = localStorage.getItem("room");
const storedAmount = localStorage.getItem("amount");

if (storedRoom) roomNoInput.value = JSON.parse(storedRoom);
if (storedAmount) depositInput.value = JSON.parse(storedAmount);



const next = document.getElementById("post");
next.addEventListener("click", (e) => {
    e.preventDefault();
    
    
    const name = document.getElementById("name").value.trim();
    const passport = document.getElementById("passport").value.trim();
    const phone = document.getElementById("phone").value.trim();
    const room = document.getElementById("room").value.trim();
    const amount = document.getElementById("amount").value.trim();
    const mode = document.getElementById("mode").value.trim();
    const telephone = document.getElementById("telephone").value.trim();
    
    
    const promptButton = document.getElementById("prompt");
    const payButton = document.getElementById("pay");
    const cardingButton = document.getElementById("carding");
    const confirmButton = document.getElementById("confirm");

    
    const transactionCode = JSON.parse(localStorage.getItem("transactionCode"));
    const currentTID = "TOPG" + transactionCode;
    
    const log = localStorage.getItem("loggedInUser");

    
    if (!name || !passport || !phone || !room || !amount || !mode) {
        alert("Please fill in all the required fields.");
        return;
    }

    
    localStorage.setItem("name", JSON.stringify(name));
    localStorage.setItem("passport", JSON.stringify(passport));
    localStorage.setItem("phone", JSON.stringify(phone));
    localStorage.setItem("room", JSON.stringify(room));
    
    localStorage.setItem("amount", JSON.stringify(Number(amount))); 

    if (log) {
        
        if (mode === "mpesa") {
            const phoneModal = document.getElementById("mpesa-modal");
            phoneModal.style.display = "block";
            document.body.style.overflow = "hidden";
            const currentMode = "mpesa";
            
            
            promptButton.onclick = () => { 
                const telInput = document.getElementById("telephone").value.trim(); 
                
                if (telInput.length >= 10 && telInput.length < 14) {
                    const pinModal = document.getElementById("pin-modal");
                    phoneModal.style.display = "none";
                    pinModal.style.display = "block";

                    payButton.onclick = (e) => { 
                        e.preventDefault();
                        const pin = document.getElementById("pin").value.trim();

                        if (pin.length === 4) {
                            alert(`Ksh ${amount} from your mpesa account will be used to book for room number ${room} by OPG REALTORS`);
                            
                            
                            const fullTransactionDetails = `${date}${currentMonth}${room}${amount} ${currentMode}`;
                            localStorage.setItem("transaction", JSON.stringify(fullTransactionDetails));
                            localStorage.setItem("DateIn", today.toISOString());
                            localStorage.setItem("payments", JSON.stringify(`Confirmed Paid KSH ${amount} to OPG House & Realtors for room ${room} month of ${currentMonth}.`));
                            
                            
                            updateHistory(Number(amount), currentMode, currentTID, room); 
                            
                            
                            pinModal.style.display = "none";
                            alert(`You have successfully paid for your room. Room number ${room} for the month of ${currentMonth}.`);
                            window.location.href = "PROFILE.HTML";
                            
                        } else {
                            alert("PIN must be 4 digits long.");
                        }
                    };

                } else {
                    alert("Please check phone number again");
                }
            };
            
        
        } else if (mode === "card") {
            const cardModal = document.getElementById("card-modal");
            cardModal.style.display = "block";
            document.body.style.overflow = "hidden";
            const currentMode = "card";

            cardingButton.onclick = () => { 
                const cardNumber = document.getElementById("cardNumber").value.trim();
                
                if (cardNumber.length >= 16 && cardNumber.length < 20) {
                    const cvvmodal = document.getElementById("cvv-modal");
                    cardModal.style.display = "none";
                    cvvmodal.style.display = "block";

                    confirmButton.onclick = () => {
                        const cvv = document.getElementById("cvv").value.trim();
                        
                        if (cvv.length >= 3 && cvv.length <= 4) {
                            
                            
                            
                            
                            const fullTransactionDetails = `${date}${currentMonth}${room}${amount} ${currentMode}`;
                            localStorage.setItem("transaction", JSON.stringify(fullTransactionDetails));
                            localStorage.setItem("DateIn", today.toISOString());
                            localStorage.setItem("payments", JSON.stringify(`Confirmed Paid KSH ${amount} to OPG House & Realtors for room ${room} month of ${currentMonth}.`));

                            
                            updateHistory(Number(amount), currentMode, currentTID, room);
                            
                            
                            alert(`You have successfully paid for house number ${room} for the month of ${currentMonth}.`);
                            cvvmodal.style.display = "none";
                            window.location.href = "PROFILE.HTML";
                            
                        } else {
                            alert("CVV must be 3 to 4 digits long.");
                        }
                    };

                } else {
                    alert("Card number must be at least 16 characters long");
                }
            };

        } else {
            alert("Please select a valid payment mode (mpesa or card).");
        }

    } else {
        alert("You cannot book a room if you have not logged in. Please log in first.");
        window.location.href = "LOGIN.HTML";
    }
});



const dp = document.getElementById("profile");
const sign = document.querySelector("#sign");
const logg = localStorage.getItem("loggedInUser");
const pass1 = localStorage.getItem("password1");
const pass = localStorage.getItem("password");

function showDp() {
    if (pass && pass1) {
        dp.style.display = "block";
        sign.style.display = "none";
    } else {
        dp.style.display = "none";
        sign.style.display = "block";
    }
}

window.onload = showDp;

function hideRoom(roomNumber) {
    const bookedRoomId = JSON.parse(localStorage.getItem("room"));
    const houses = JSON.parse(localStorage.getItem("houses")) || [];

    const roomIndex = houses.findIndex(r => r.room === bookedRoomId);

    if (roomIndex !== -1) {
        houses[roomIndex].booked = true;
        localStorage.setItem("houses", JSON.stringify(houses));

        let bookedRoom = JSON.parse(localStorage.getItem("bookedRoom")) || [];

        if (!bookedRoom.includes(bookedRoomId)) {
            bookedRoom.push(bookedRoomId);
            localStorage.setItem("bookedRoom", JSON.stringify(bookedRoom));
        }
    }
    
   
}
    
    function retrieveAndDisplayPhoto() {    
    const savedPhotoDataURL = localStorage.getItem("myPhoto");        
    const container = document.getElementById("profile");
   
    if (savedPhotoDataURL && container) {
    
    const link = document.createElement('a');
    
    link.href = "PROFILE.HTML"; 
    
    const img = document.createElement('img');
    img.src = savedPhotoDataURL;
    img.alt = "User Profile Picture";
    img.className = 'profile-photo';     
    link.appendChild(img); 
    
    container.innerHTML = '';         
    container.appendChild(link); 
    
} else if (container) {
    
    container.innerHTML = '<a href="PROFILE.HTML">Profile Photo.</a>';
}
   
}

document.addEventListener('DOMContentLoaded', retrieveAndDisplayPhoto);
    
    
    
    </script>
    
</body>
