<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>new password</title>
<style>
*{
    padding: 0;
    margin: 0;
    box-sizing: border-box;
    outline: none;    

}
body{
    background: linear-gradient(to  #1b03f5 10% ,white 90%);
    padding: 0;
    margin: 0;
    transition: all 0.8s ease-in-out;
    box-sizing: border-box;        
    display: flex;    
    flex-direction: column;
    clear: both;
    height: 100vh;
    transition: all 1s ease-in-out;


}
form{
box-sizing: border-box;
box-shadow: 0 0 10px;
margin-top: 5%;
width: 40%;
height: 60vh;
padding: 1em;
border-radius: 0.625em;
z-index: 500;
margin-left: 30%;
background: linear-gradient(45deg,#1b03f5,#6151e9);
box-shadow: 0 0 10px gold ;
transition: all;
color: white;

}

header{
width: 100%;
height: 4em;
box-shadow: 0 0 10px black, 0 0 10px white;
z-index: 1000;
position: relative;
background: rgba(0,0,0,0.9 );
text-align: center;
justify-content: center;
padding-top: 2em;

}

footer{
box-shadow: 0 -5px 0 black, 0 -5px 0 white;
min-height: 5em;
text-align: center;
width: 100%;
margin-bottom: 0;    
padding-bottom: 0;
margin-top: 2em;

}
fieldset{
border: none;
color: auto;
margin-bottom: 2em;

}
input{
height: 2.5em;
border-radius: 1.5em;
border: 1px solid black;
padding-left: 2em;
width: 93%;
margin-right: 0.335em;
height: 2.8em;

}
#save{
padding: 0.625em 1em 0.625em 1em;
border-radius: 1.5em;
background: linear-gradient(to left,white, green);
box-shadow: 0 0 10px;
border: none;
margin-top: 1em;
float: right;

}
body.dark{
    background-color: #080808 !important;
    color: white;

}
body.light{
    background: linear-gradient(#f0f0f0,#f0f0f0)!important;
    color: black;

}
body.developers{
    background: linear-gradient(to right,#070733,#3b296d) !important;
    color: #00ff00;

}
body.dark a, body.developers a{
color: white;

}
h3,h4{
    color: orangered;
    text-align: center;

}
#back{
padding-top: 2em;
color: white;
color: auto;
text-shadow: 1px 1px 1px black,1px 1px 1px white;

}
#back:hover{
color: #00ff00;
transition: .5s;
font-size: large;

}
input[type="checkbox"]{
width: 0.925em;
height: 0.925em;


}
#different{
color: red;
font-size: x-small;
margin-left: 10%;
padding-top: 0;
display:none;
font-weight: 300;

}
.strength{
display: inline-block;
text-align: center;

}
#strong,#strong1{
color: rgb(3, 253, 3);
font-weight: 300;
font-size: x-small;
display: none;


}
#weak,#weak1{
color: orangered;
font-weight:300;
font-size: x-small;
display: none;

}
sup{
    color: red;
    font-size: large;
    text-shadow: 0 0 2px white;

}




@media(max-width:768px){
    form{
        width: 60%;
        height: 60vh;
        margin-left: 20%;            



    }
   input{
    width: 90%;
    height: 2.5em;

    
   }



}








</style>

<script>
function setTheme(theme){
    
    document.body.className="";
    document.body.classList.add(theme);
    localStorage.setItem("theme",theme);
    
}


  window.addEventListener("load",()=>{
    const localTheme=localStorage.getItem("theme") || "light";
    setTheme(localTheme);
    
    document.getElementById(localTheme).checked=true;
    
    
});</script>



</head>
<body>
     <header>
    
    <h3>Forgot password</h3>
    
    </header>
    <main>
    <form action="">
    <h4>CREATE NEW PASSWORD</h4>
    <fieldset>
        <fieldset>
        <legend>New Password <sup>*</sup></legend>    
            <input type="password" maxlength="16" autocomplete="new-password" name="newpass" id="pass1" placeholder="New Password"><input ondblclick="show()" type="checkbox" name="password" id="pass" onclick="if(this.checked){pass1.type='text'} else{pass1.type='password'}">                       
            <div class="strenght">
                <sub id="strong1">Strong Password</sub>
                <sub id="weak1">weak password</sub>
                        
            </div>
    
        </fieldset>
        <fieldset>
        <legend>Confirm Password <sup>*</sup></legend>    
            <input type="password" maxlength="16" autocomplete="new-password" name="newpass" id="pass2" placeholder="Confirm Password"><input ondblclick="show()" type="checkbox" name="password" id="pass" onclick="if(this.checked){pass2.type='text'} else{pass2.type='password'}">                       
    
            <div class="strenght">
                <sub id="strong">Strong Password</sub>
                <sub id="weak">weak password</sub>
                <sub id="different">Your password Does Not match  </sub>
        
            </div>
            
    
        </fieldset>
    
    
    
    
    
    
    </fieldset>
    
    <button id="save">Save</button><br>
        <a id="back" href="index.html">Back</a>
    
    
    </form>
    
    </main>
        <footer>
    
         <div class="developer">
        <h4>Developed by</h4>
        
    <p id="user">Outcast DHO</p>
    </div>
    
    <p id="copy"> OPG House and Real estates &reg; </p>
   <p id="rights"> All Rights Reserved &copy;2025</p>   
    

    </footer>
    
    
    <script>
    
    const newpass=document.getElementById("pass1");
    newpass.addEventListener("input",()=>{
    const weak=document.getElementById("weak1");
    const strong=document.getElementById("strong1");
    const pass=newpass.value;
    if(pass.length>=8){
        strong.style.display="block";
    setTimeout(()=>{ strong.style.display="none";},500);
    
    }
    else{
    weak.style.display="block";
    setTimeout(()=>{ weak.style.display="none"; },500);
    
    }
    });
    
    const oldpass=document.getElementById("pass2");
    oldpass.addEventListener("input",()=>{
        const weak=document.getElementById("weak");
        const strong=document.getElementById("strong");
        const pass=oldpass.value;
        if(pass.length>=8){
            strong.style.display="block";
            setTimeout(()=>{ strong.style.display="none"; },2500);
    
        }
        else{
            weak.style.display="block";
            setTimeout(()=>{ weak.style.display="none"; },500);
    
    }      
    
    });
    
    
    const save=document.getElementById("save").addEventListener("click",(e)=>{
    e.preventDefault();
    const pass1=document.getElementById("pass1").value.trim();
    const pass2=document.getElementById("pass2").value.trim();
    const wrong=document.getElementById("different");
    
    if(pass1 && pass2){
        if(pass1===pass2){
            alert("You have Succesfully Reset Your Password.");
            window.location.href="LOGIN.HTML";
            
            localStorage.setItem("password",JSON.stringify(pass2));
    
        }
        else{
            wrong.style.display="block";
            
            setTimeout(()=>{ alert(" Your passwords does not match. "); wrong.style.display="none"; },2000);
            return;
    
        }
    }
    else{
        alert("Please Fill in all fields.");
        return;   
    
    }
    
    });
    
    
    
    
    
    
    
    
    
    </script>
    
</body>
</html>
