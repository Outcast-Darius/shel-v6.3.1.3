<style>
*{
    padding: 0;
    margin: 0;
    box-sizing: border-box;

}
body{
    background: linear-gradient(to  #1b03f5 10% ,white 90%);

    margin: 0;

    box-sizing: border-box;


}
header{
width: 100%;
height: 4em;
box-shadow: 0 0 10px black, 0 0 10px white;
z-index: 1000;
position: fixed;
background: rgba(0,0,0,0.9 );

justify-content: center;

}
nav{

    text-align: center;    
    align-items: center;
    float: left;    
    margin-left: 30%;

}
nav a{
    padding: 1em 5em 0 0;
    text-decoration: none;
    color: white;

}
nav a:hover{
color: blue;
transition: .5s ease-in-out 

}
nav a :active{
    color: brown;


}
main::after{
content: "";
clear: both;
display: block;

}
main>div{
float: left;
height: 40vh;
align-items: stretch;
margin-top: 5em;
padding:1em;
overflow: hidden;

}
.transactions{
width: 70%;
margin-left: 1em;
box-shadow: 0 0 15px black,0 0 15px white ;
overflow: auto;

}
.time-spent{
width: 22%;
box-shadow: 0 0 15px black,0 0 15px white;
margin-left: 1em;

}
section::after{
content: "";
clear: both;
display: block;

}
section>div{
float: left;
height: 50vh;
margin-top: 2em;
margin-bottom: 1em;
padding: 1em;
overflow: hidden;

}
.vacation{
width: 40%;
box-shadow: 0 0 15px black, 0 0 15px white ;
margin-left: 1em;
overflow: auto;
text-overflow: ellipsis;

}
.graphs{
width: 55%;
box-shadow: 0 0 15px black, 0 0 15px white ;
margin-left: 1em;

}
footer{
box-shadow: 0 0 10px black, 0 0 10px white;
min-height: 5em;
text-align: center;

}
h3{
text-align: center;
color: orangered;
position: relative;
margin-bottom: 0.445em;
z-index: 80;

}
body.dark{
    background-color: #080808 !important;
    color: white;

}
body.light{
    background: linear-gradient(#f0f0f0,#f0f0f0)!important;
    color: black;

}
body.developers{
    background: linear-gradient(to right,#070733,#3b296d) !important;
    color: #00ff00;

}
body.dark a, body.developers a{
color: white;

}
li{
list-style: none;
padding-left: 0;

}
main>div:hover,section>div:hover{
box-shadow: 0 0 15px blue;
transition: .2s ease-in-out;
transform: scale(1.01);

}
#days{
color: green;
font-size: 3em;
filter: drop-shadow(2px 1px 0 red);

}
#rate,#hours,#minutes,#total{
font-size: large;
filter: drop-shadow(1px 1px 0.5px rgb(95, 49, 49));
font-weight: 700;


}
.more{
box-shadow: 0 0 10px;
height:50vh;
margin:1em;
padding: 1em;
overflow: auto;


}
table {
background: #dddcdc;
padding: 0.225em;
border-radius: 0.25em;
z-index: 40;
width: 95%;
text-align: center;


}
table th{
background: grey;
padding-left: 0.225em;
padding-right: 0.225em;
color: orangered;
filter: drop-shadow(1px 1px 1px black);
text-shadow: 1px 1px 1px black;

}
table td{
gap: 2px;
background: transparent;
color: #080808;
backdrop-filter: blur(50px);
width: auto;
text-align: center;

}

#stats{
background: aliceblue;
border-radius: 0em;
padding:0 0.225em 0 0.225em;
height: -10px;

}






@media (max-width:768px){
main{
    display: flex;
    flex-wrap: wrap;
    column-count: 1;
    flex-direction: column;
    justify-content: center;
    display: grid;

}
.transactions,.time-spent{
    width: 22em;
    overflow: auto;
    
    
}
section{
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    column-count: 1;

}
.vacation{
width: 20em;

}
.graphs{
width: 20em;

}
nav a{
padding-left:0 ;
margin-left: 0;


}
nav{
margin-left: 7%;

}
table{
font-size: 12px;
width: 100%;
margin-right: 1em;

}



}


</style>
<script>
function setTheme(theme){
    
    document.body.className="";
    document.body.classList.add(theme);
    localStorage.setItem("theme",theme);
    
}


  window.addEventListener("load",()=>{
    const localTheme=localStorage.getItem("theme") || "light";
    setTheme(localTheme);
    
    document.getElementById(localTheme).checked=true;
    
    
});</script>

    <script>
    
     function displayHistory() {
 const hist = document.getElementById("hist");
  const transactions = JSON.parse(localStorage.getItem("transaction")) || [];

  if (transactions.length === 0) 
    hist.innerHTML = "No Transactions Yet.";
    return;
  

  let table = `
    <table border="1">
      <tr>
        <th>Transaction ID</th>
        <th>Amount</th>
        <th>Date</th>
        <th>Payment Mode</th>
      </tr>
  `;

  transactions.forEach(tx =>{ 
    table += `
      <tr>
        <td>${tx.transactionId}</td>
        <td>${tx.amount}</td>
        <td>${tx.date}</td>
        <td>${tx.mode}</td>
      </tr>
    `;
  });

  table +=table;
  hist.innerHTML = table;
}    
   
displayHistory();
   
    
    function displayDays() {
    const entryDateStr = localStorage.getItem("DateIn"); // stored as string
    const days = document.getElementById("days");
    const hourStayed = document.getElementById("hours");
    const minuteStayed = document.getElementById("minutes");
    const rate = document.getElementById("rate");
    const total = document.getElementById("total");
    const today = new Date();

    if (entryDateStr) {
        const entryDate = new Date(entryDateStr);

        if (!isNaN(entryDate)) {
            const diffMs = today - entryDate;
            const dayStayedIn = Math.floor(diffMs / (1000 * 60 * 60 * 24));
            const hours=Math.floor(diffMs/(1000*60*60));
            const min=Math.floor(diffMs/(1000*60));
            
            minuteStayed.innerHTML=min;
            hourStayed.innerHTML=hours;
            days.innerHTML = dayStayedIn;
            console.log(dayStayedIn);
        } else {
            days.innerHTML = "Invalid date format";
            console.error("entryDate is invalid.");
        }
    } else {
        days.innerHTML = "0";
        console.warn("No DateIn found in localStorage.");
    }
    
    let charges=JSON.parse(localStorage.getItem("amount"));
    let totalHours=(30*24);
    let charge=(charges/totalHours);
    const hourlyRate=(charge/135 ) ;
    rate.textContent=hourlyRate;
   
   totalRate=hourStayed.textContent*hourlyRate;
   total.textContent=totalRate; 
    
    
}

displayDays();
    
    
  const h=JSON.parse(localStorage.getItem("history")) || [];
   
    
    function displayReport() {
  const hist = document.getElementById("hist");

  if (h.length > 0) {
    let table = `
      <table id="transaction-history">
        <tr><th>TransactionID</th><th>Amount<sub>(ksh)</sub></th><th>Date</th><th>Mode</th></tr>
    `;

    h.forEach(item => {
      table += `
        <tr>
          <td>${item.TID}</td>
          <td>${item.amount}</td>
          <td>${item.DATE}</td>
          <td>${item.mode}</td>
        </tr>
      `;
    });

    table += "</table>";
    hist.innerHTML = table;
  } else {
    hist.innerHTML = "No Transaction history Yet";
    hist.style.color="red";
  
  }
}

displayReport();
   

function displayRequests() {
    const request = document.getElementById("requests");
    
    
    const room = JSON.parse(localStorage.getItem("door"));
    const floor = JSON.parse(localStorage.getItem("floor"));
    const bal = JSON.parse(localStorage.getItem("bal"));
    
    
    const dateString = localStorage.getItem("Date"); 
    
    
    const today = new Date();
    today.setHours(0, 0, 0, 0); 

    let dateDiff = 0;
    let status = ""; 
    let remarks = ""; 
 

    
    if (dateString) {
        
        const vacateDate = new Date(dateString);
        vacateDate.setHours(0, 0, 0, 0); 

        
        const timeDiff = Math.abs(today.getTime() - vacateDate.getTime());        
        dateDiff = Math.floor(timeDiff / (1000 * 60 * 60 * 24));
       const stats=document.querySelector("#stats");
        
        if (dateDiff > 3) {
            status = "Pending"; 
            remarks="inspction in proggress... "; 
             
        } else {
            status = "Approved";
          remarks="Ready to Leave";
        
        }
    } else {
        
        status = "_";
        remarks = "_";
    }

    
    request.innerHTML = `
        <table id="vacation">
            <thead>
                <tr>
                    <th>House_No</th>
                    <th>Floor</th>
                    <th>Date_Out</th>
                    <th>Status</th>
                    <th>Balance/Complaints</th>
                    <th>Remarks</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>${room || '_'}</td>
                    <td>${floor || '_'}</td>
                    <td>${dateString || '_'}</td>
                    <td id="stats">${status}</td>
                    <td>${bal || '_'}</td>
                    <td>${remarks || '_'}</td>
                </tr>
            </tbody>
        </table>
    `;
}

displayRequests();

    
    </script>
