<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>password Reset</title>
<style>
*{
    padding: 0;
    margin: 0;
    box-sizing: border-box;
    outline: none;    

}
body{
    background: linear-gradient(to  #1b03f5 10% ,white 90%);
    padding: 0;
    margin: 0;
    transition: all 0.8s ease-in-out;
    box-sizing: border-box;        
    display: flex;    
    flex-direction: column;
    clear: both;
    height: 100vh;
    transition: all 1s ease-in-out;


}
form{
box-sizing: border-box;
box-shadow: 0 0 10px;
margin-top: 5%;
width: 40%;
height: 60vh;
padding: 1em;
border-radius: 0.625em;
z-index: 500;
margin-left: 25%;
background: linear-gradient(45deg,#1b03f5,#6151e9);
box-shadow: 0 0 10px gold ;
transition: all;

}
header{
width: 100%;
height: 4em;
box-shadow: 0 0 10px black, 0 0 10px white;
z-index: 1000;
position: relative;
background: rgba(0,0,0,0.9 );
text-align: center;
justify-content: center;
padding-top: 2em;

}

footer{
box-shadow: 0 -5px 0 black, 0 -5px 0 white;
min-height: 5em;
text-align: center;
width: 100%;
margin-bottom: 0;    
padding-bottom: 0;
margin-top: 2em;

}
fieldset{
border: none;
color: auto;
margin-bottom: 2em;

}
input{
height: 2em;
border-radius: 1.5em;
border: 1px solid black;
padding-left: 2em;
width: 95%;
height: 2.8em;

}
sup{
color: red;

}
sub{
color: white;
text-shadow: 1px 1px 1px black;

}
#generate{
padding: 0.625em 1em 0.625em 1em;
border-radius: 1.5em;
background: linear-gradient(to left,white, green);
box-shadow: 0 0 10px;
border: none;
margin-top: 1em;
float: right;

}
body.dark{
    background-color: #080808 !important;
    color: white;

}
body.light{
    background: linear-gradient(#f0f0f0,#f0f0f0)!important;
    color: black;

}
body.developers{
    background: linear-gradient(to right,#070733,#3b296d) !important;
    color: #00ff00;

}
body.dark a, body.developers a{
color: white;

}
h3{
    color: orangered;
    text-align: center;

}
#back{
padding-top: 2em;
color: white;
color: auto;
text-shadow: 1px 1px 1px black,1px 1px 1px white;

}
#back:hover{
color: #00ff00;
transition: .5s;
font-size: large;

}

@media(max-width:768px){
    form{
        width: 60%;
        height: 60vh;

    }
   




}


</style>

<script>
function setTheme(theme){
    
    document.body.className="";
    document.body.classList.add(theme);
    localStorage.setItem("theme",theme);
    
}


  window.addEventListener("load",()=>{
    const localTheme=localStorage.getItem("theme") || "light";
    setTheme(localTheme);
    
    document.getElementById(localTheme).checked=true;
    
    
});</script>


</head>
<body>
    <header>
    
    <h2>Forgot password</h2>
    
    </header>
    <main>
    <form action="">
    <h3>Get Code</h3>
    <p>Enter either Email or Phone number to get code</p>
    <fieldset>
        <legend>Phone Number<sup>*</sup></legend>    
        <input type="tel" name="phone" id="phone" required placeholder="+254712345678">
        
    </fieldset>
    <fieldset>
    <legend>Email address<sub>(optional)</sub></legend>
    <input type="email" name="email" id="email" placeholder="e.g.@example@gmail.com">
    
    </fieldset>
    <p><span id="code"></span></p>
    
    
    
    
    
    <button id="generate"  >Send Code</button><br>
    
    <a id="back" href="LOGIN.HTML">Back</a>
    
    </form>
    </main>
    
    <footer>
    
         <div class="developer">
        <h4>Developed by</h4>
        
    <p id="user">Outcast DHO</p>
    </div>
    
    <p id="copy"> OPG House and Real estates &reg; </p>
   <p id="rights"> All Rights Reserved &copy;2025</p>   
    

    </footer>
    
    <script>
    
    function generateCodes(length=6){
    const characters="ABCDEFGHIJKLMNOPQRSTUIWXYZ0123456789";
    let code="";
    for(let i=0; i<length; i++){
    code+=characters.charAt(Math.random()*characters.length);}
    return code;   
      
    
    }
    function saveCode(){
    
    const code=generateCodes();
    localStorage.setItem("code",JSON.stringify(code));
    
    }
    
    
    const codeDisplay=document.getElementById("code");
    const code=JSON.parse(localStorage.getItem("code"));
    
    codeDisplay.innerHTML=code;
    
    const generate=document.getElementById("generate").addEventListener("click",(e)=>{
        e.preventDefault();saveCode();
    const email=document.getElementById("email").value.trim();
    const phone=document.getElementById("phone").value.trim();
    if(phone || email){
    const coded=JSON.parse(localStorage.getItem("code"));
    generateCodes();
        setTimeout(()=>{ 
            alert("Copy and use this "+coded+ " as your verification Code")
    
            window.location.href="VERIFICATION.HTML";
    
    
        },2000);
    
    }
    else{
    alert("Please fill in atleast One field");
    return;
    
    }
    
    });
    
    
    
    
    </script>
    
</body>
</html>
