<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>profile photo</title>
<style>

*{
    padding: 0;
    margin: 0;
    box-sizing: border-box;

}
body{
    background: linear-gradient(to  #1b03f5 10% ,white 90%);
    padding: 0;
    margin: 0;
    transition: all 0.8s ease-in-out;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    position: relative;
    
}
 form{
 box-shadow: 0 0 10px ;
 height: 50vh;
 width: 40%;
 z-index: 300;
 border-radius: 1em;
 margin-top: 2em;
 position: relative;
 float: none;
 margin-left: 30%;
 align-items: center;
 padding: 1em;
  
 }
header{
width: 100%;
height: 4em;
box-shadow: 0 0 10px black, 0 0 10px white;
z-index: 1000;
position: relative;
background: rgba(0,0,0,0.9 );
text-align: center;
justify-content: center;
padding-top: 2em;

}
nav{
    display: flex;;
    text-align: center;    
    align-items: center;
    float: left;    
    margin-left: 35%;

}
nav a{
    padding: 1em 5em 0 0;
    text-decoration: none;
    color: white;

}
nav a:hover{
color: blue;
transition: .5s ease-in-out 

}
nav a :active{
    color: brown;


}
.photo-block{
    display: block;
    max-width: 100%;
    height: auto;
    
    object-fit: cover;
    
}
#preview{
height: 7em;
width: 7em;
border-radius: 50%;
overflow: hidden;
box-shadow: 0 0 1px black;
margin-bottom: 1.5em;
background: whitesmoke;
margin-top: 0.625em;
filter: drop-shadow(0 0 5px );


}
.main{
margin-top: 6em;
transform: translate(50% ,50%);
right: 0 ;
bottom: 0;


}
input{
height: 2.8em;


}
#save{
width: auto;
border: none;
padding: 0.625em 1em ;
border-radius: 1.2em;
background: linear-gradient(to right,white,blue);
box-shadow: 0 0 10px;
float: right;


}
h2{
color: orangered;
text-align: center;

}
body.dark{
    background: #080808 !important;
    color: white;

}
body.light{
    background: #f0f0f0 !important;
    color: black;

}
body.developers{
    background: linear-gradient(to right,rgb(7, 7, 51),rgb(3, 3, 158)) !important;
    color: #00ff00;

}
body.dark a, body.developers a{
color: white;


}
nav li{
list-style: none;

}










@media (max-width:768px){
nav a{
padding-left:0 ;
margin-left: 0;


}
nav{
margin-left: 10%;

}
main{
transform: translate(30%,40%)


}
form{
width: 70%;
margin-left: 15%;
height: 50vh;
margin-top: 5em;

}



}









</style>

<script>

function setTheme(theme){
    
    document.body.className="";
    document.body.classList.add(theme);
    localStorage.setItem("theme",theme);
    
}


  window.addEventListener("load",()=>{
    const localTheme=localStorage.getItem("theme") || "light";
    setTheme(localTheme);
    
    document.getElementById(localTheme).checked=true;
    
    
});</script>


</head>
<body>
    <header>
    <nav>
    <li><a href="index.html">Home</a></li>
    <li><a href="REPORTS.HTML">Reports</a></li>
    <li><a href="PROFILE.HTML">Profile</a></li>
    <li><a href="SETTINGS.HTML">Settings</a></li>
    
    
    
    </nav>
    
    </header>
    
        <form action="">
        <h2>Change Photo</h2>
    <div id="preview"></div>
    
    <input type="file" name="profile" id="photo" accept="image/*"><br>
    
    
    <button id="save">Save</button>
    
        </form>
    
    
    
    

    
    
    
    
    
    
    
    
    
    
    
    
    <script>
document.getElementById("photo").addEventListener("change", (e) => {
    const file = e.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    
    reader.onload = function (evt) {
        // 1. Preview the image (on the current page)
        const preview = document.getElementById('preview');
        preview.innerHTML = ''; // Clear previous preview
        
        const img = document.createElement('img');
        img.src = evt.target.result;
        img.alt = file.name;
        img.className = 'photo-block'; // Use this class for styling
        preview.appendChild(img);

        
        localStorage.setItem("myPhoto", evt.target.result);
    };
    
    
    reader.readAsDataURL(file);
});


document.getElementById("save").addEventListener("click", () => {
    
    if (localStorage.getItem("myPhoto")) { 
        alert("Profile picture successfully updated.");
        
       setTimeout(()=> { console.log("saved succesfully");
        window.location.href = "index.html";},2000); 
        
    } else {
        alert("Please select a file to update your profile picture.");
        return;
    }
});
    
    function retrieveAndDisplayPhoto() {    
    const savedPhotoDataURL = localStorage.getItem("myPhoto");        
    const container = document.getElementById("preview");
    
    if (savedPhotoDataURL && container) {
    
    const link = document.createElement('a');
    
    link.href = "PROFILE.HTML"; 
    
    const img = document.createElement('img');
    img.src = savedPhotoDataURL;
    img.alt = "User Profile Picture";
    img.className = 'profile-photo';     
    link.appendChild(img); 
    
    container.innerHTML = '';         
    container.appendChild(link); 
    
} else if (container) {
    
    container.innerHTML = '<a href="PROFILE.HTML">Profile Photo.</a>';
}
}

document.addEventListener('DOMContentLoaded', retrieveAndDisplayPhoto); 
    
    
    
    
    
    </script>
    
</body>
</html>
