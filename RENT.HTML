<script>
       function setTheme(theme){
    
    document.body.className="";
    document.body.classList.add(theme);
    localStorage.setItem("theme",theme);
    
}


  window.addEventListener("load",()=>{
    const localTheme=localStorage.getItem("theme") || "light";
    setTheme(localTheme);
    
    document.getElementById(localTheme).checked=true;
    
    
});
</script>

<body>
    <header>

    <div class="modal" id="mpesa-modal">
    <div class="modal-window" >
        <h2>mpesa Payment</h2>
        <p>Enter Phone number to prompt payment.</p>
        
        <input id="phone" type="tel" placeholder="+254712345678" minlength="10" maxlength="14">

        <button id="prompt">Prompt</button>

    <div class="modal-window" >
        <h2>mpesa Payment</h2>

        <input type="password" name="pin" id="pin" placeholder="****" maxlength="4" minlength="4">

        <input type="text" maxlength="20" placeholder="e.g 1234 4567 8901 2345 6789" minlength="16" id="cardNumber">
    <br>
        <button id="carding">Next</button>
        
    
    </div>

    <div class="modal" id="cvv-modal">
    <div class="modal-window" >
        <h2>BANK Payment</h2>
        <p>Enter Card CVV</p>
    <input type="password" name="cvv" id="cvv" placeholder="*****" minlength="3" maxlength="4">
    <br>
        <button id="confirm">Pay</button>
    
    </div>
    </div>
    
    <form action="">
    <h2>MONTHLY RENT PAYMENT</h2>
    <fieldset>
    <fieldset>
    <legend>ROOM NUMBER <sup>*</sup></legend>
    <input type="text" readonly name="room" id="door" placeholder="Room Number">
            
    </fieldset>
    <fieldset>
    <legend>FLOOR NUMBER <sup>*</sup></legend>
    <input type="text" readonly name="floor" id="floor" placeholder="Floor Number">
    
    </fieldset>
    <fieldset>
    <legend>AMOUNT <sup>*</sup></legend>
    <input type="currency" readonly name="amount" id="amount" placeholder="Amount in KSH">
    
    </fieldset>
    <fieldset>
    <label for="mode">PAYMENT MODE :</label><select name="mode" id="mode" >
    <option value=""></option>
    <option name="mode" value="mpesa">MPESA</option>
    <option name="mode" value="card">DEBIT / CREDIT CARD</option>
    <option value=""></option>
    </select>
    
    </fieldset>
    </fieldset>
    
    <button id="next">Next</button>
    
    
    
    </form>
    
    <script>
 
        
     const dp = document.getElementById("profile");
     const sign = document.querySelector("#sign");

     const logg = localStorage.getItem("loggedInUser");
     const pass1 = localStorage.getItem("password1");
     const pass = localStorage.getItem("password");

    function showDp() {
    if (pass && pass1) {
        dp.style.display = "block";
        sign.style.display = "none";
    } else {
        dp.style.display = "none";
        sign.style.display = "block";
     }
    }

window.onload = showDp;

 const roomNo=document.getElementById("door");    
 const floorNo=document.getElementById("floor");    
 const deposit=document.getElementById("amount");   
    
 const room=localStorage.getItem("room");   
 const amount=localStorage.getItem("amount");   
 const floor=localStorage.getItem("floor");   
    
    const roomNumber=JSON.parse(room);
    const floorNumber=JSON.parse(floor);
    const depositAmount=JSON.parse(amount);
    
    roomNo.value=roomNumber;
    deposit.value=depositAmount;   
    floorNo.value=floorNumber;   


function generateCodes(length = 6) {
    const characters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
    let code = "";
    for (let i = 0; i < length; i++) {
        code += characters.charAt(Math.floor(Math.random() * characters.length));
    }
    return code;
}

function saveCode() {
    const code = generateCodes();
    localStorage.setItem("codde", JSON.stringify(code));
}
saveCode();


const months = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
const d = new Date();
let month = months[d.getMonth()];


function updateHistory(transactionAmount, transactionMode, transactionID, roomNumber, monthName) {
    
    let h = JSON.parse(localStorage.getItem("history")) || [];

    
    const newTransaction = {
        TID: transactionID,
        amount: transactionAmount,
        DATE: new Date().toISOString(), 
        mode: transactionMode,
        summary: `Confirmed Paid KSH ${transactionAmount} to OPG House & Realtors for room ${roomNumber} month of ${monthName}.`
    };

    
    h.push(newTransaction);
    localStorage.setItem("history", JSON.stringify(h));
}


const makePayment = document.getElementById("next");


makePayment.addEventListener("click", (e) => {
    e.preventDefault();

    
    const amountInput = document.getElementById("amount");
    const modeInput = document.getElementById("mode");
    
    
    const currentAmount = amountInput ? amountInput.value.trim() : "0";
    const currentMode = modeInput ? modeInput.value.trim() : "";
    
    
    const codes = JSON.parse(localStorage.getItem("codde"));
    const currentTID = "TOPG" + codes;

    
    const prompt = document.getElementById("prompt");
    const confirmP = document.getElementById("confirm");
    const carrd = document.getElementById("carding");
    const pay = document.getElementById("pay");

    
    if (currentMode === "mpesa") {
        const phoneModal = document.getElementById("mpesa-modal");
        phoneModal.style.display = "block";
        document.body.style.overflow = "hidden";

        prompt.addEventListener("click", () => {
            const phone = document.getElementById("phone").value.trim();

            if (phone.length >= 10 && phone.length < 14) {
                const pinModal = document.getElementById("pin-modal");
                phoneModal.style.display = "none";
                pinModal.style.display = "block";

                pay.addEventListener("click", (e) => {
                    e.preventDefault();
                    const pin = document.getElementById("pin").value.trim();

                    if (pin.length === 4) {
                        alert("ksh " + currentAmount + " from your mpesa account will be transfered to OPG REALTORS");

                        
                        updateHistory(currentAmount, "mpesa", currentTID, room, month);
                        localStorage.setItem("payments", JSON.stringify(`Confirmed Paid KSH ${currentAmount} to OPG House & Realtors for room ${room} month of ${month}.`));

                        alert(`You have succesfully paid for your room. Room number ${room} for the month of ${month}.`);
                        pinModal.style.display = "none";
                        document.body.style.overflow = "";
                        window.location.href = "PROFILE.HTML";


                    } else {
                        alert("PIN must be exactly 4 digits long.");
                        return;
                    }
                });
            } else {
                alert("Please check phone number again");
                return;
            }
        });
    }

    
    else if (currentMode === "card") {
        const card = document.getElementById("card-modal");
        card.style.display = "block";
        document.body.style.overflow = "hidden";

        carrd.addEventListener("click", () => {
            const cardNumber = document.getElementById("cardNumber").value.trim();
            if (cardNumber.length >= 16 && cardNumber.length < 20) {
                const cvvmodal = document.getElementById("cvv-modal");
                card.style.display = "none";
                cvvmodal.style.display = "block";

                confirmP.addEventListener("click", () => {
                    const cvv = document.getElementById("cvv").value.trim();
                    if (cvv.length >= 3 && cvv.length <= 4) {

                        
                        updateHistory(currentAmount, "card", currentTID, room, month);
                        localStorage.setItem("payments", JSON.stringify(`Confirmed Paid KSH ${currentAmount} to OPG House & Realtors for room ${room} month of ${month}.`));

                        alert(`You have succesfully paid for house number ${room} for the month of ${month}.`);
                        cvvmodal.style.display = "none";
                        document.body.style.overflow = "";
                        window.location.href = "PROFILE.HTML";

                    } else {
                        alert("CVV must be 3 to 4 digits long.");
                        return;
                    }
                });
            } else {
                alert("Card number must be atleast 16 characters long");
                return;
            }
        });
    }

    else {
        alert("You have not selected mode of payment");
        return;
    }
});
 
  function retrieveAndDisplayPhoto() {    
    const savedPhotoDataURL = localStorage.getItem("myPhoto");        
    const container = document.getElementById("profile");
    
    if (savedPhotoDataURL && container) {
    
    const link = document.createElement('a');
    
    link.href = "PROFILE.HTML"; 
    
    const img = document.createElement('img');
    img.src = savedPhotoDataURL;
    img.alt = "User Profile Picture";
    img.className = 'profile-photo';     
    link.appendChild(img); 
    
    container.innerHTML = '';         
    container.appendChild(link); 
    
} else if (container) {
    
    container.innerHTML = '<a href="PROFILE.HTML">Profile Photo.</a>';
}
}

document.addEventListener('DOMContentLoaded', retrieveAndDisplayPhoto);
 
     
    </script>
